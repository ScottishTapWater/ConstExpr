name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/ConstExpr.slnx
      - name: Build
        run: dotnet build src/ConstExpr.slnx -c Release --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
      - name: Check formatting
        run: dotnet format src/ConstExpr.slnx --verify-no-changes --no-restore
      - name: Pack
        run: dotnet pack src/ConstExpr.slnx -c Release --no-build --no-restore -o artifacts/packages -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
      - name: Check package layout
        run: bash .github/scripts/check-package.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Test
        run: dotnet test --solution src/ConstExpr.slnx -c Release --no-build --no-restore --report-trx --results-directory "$GITHUB_WORKSPACE/artifacts/test-results"
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
